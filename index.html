<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <section>
      <div class="blue-box">
        <h2 class="blue-result">Your Result</h2>
        <div class="main-ball">
          <h1 class="main-natija">76</h1>
          <span class="main-tadan">of 100</span>
        </div>
        <h1 class="blue-title">Great</h1>
        <p class="blue-text">
          Your performance exceed 65% of the people conducting the test here!
        </p>
      </div>
      <div class="oq-box">
        <h2 class="oq-result">Summary</h2>
        <div class="natijalar">
          <div class="natija reaction">
            <div class="natija-box">
              <img
                class="natija-img"
                src="./images/iconoir_flash.svg"
                alt="flash"
              />
              <span class="natija-title reaction-title">Reaction</span>
            </div>
            <div class="ball">
              <span class="natija-ball">80</span>
              <span class="tadan">/ 100</span>
            </div>
          </div>

          <div class="natija memory">
            <div class="natija-box">
              <img
                class="natija-img"
                src="./images/iconoir_brain.svg"
                alt="brain"
              />
              <span class="natija-title memory-title">Memory</span>
            </div>
            <div class="ball">
              <span class="natija-ball">92</span>
              <span class="tadan">/ 100</span>
            </div>
          </div>

          <div class="natija verbal">
            <div class="natija-box">
              <img
                class="natija-img"
                src="./images/iconoir_chat-remove.svg"
                alt="chat"
              />
              <span class="natija-title verbal-title">Verbal</span>
            </div>
            <div class="ball">
              <span class="natija-ball">61</span>
              <span class="tadan">/ 100</span>
            </div>
          </div>

          <div class="natija visual">
            <div class="natija-box">
              <img
                class="natija-img"
                src="./images/iconoir_eye-empty.svg"
                alt="eye"
              />
              <span class="natija-title visual-title">Visual</span>
            </div>
            <div class="ball">
              <span class="natija-ball">73</span>
              <span class="tadan">/ 100</span>
            </div>
          </div>
        </div>
        <button class="btn">Continue</button>
      </div>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
